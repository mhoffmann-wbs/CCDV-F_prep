# Example only. To use it, copy this file to .github/workflows/claude-review.yml
# at the root of your repository and add ANTHROPIC_API_KEY as a repository secret.
name: Claude review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Headless review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ci/claude-review.sh

# Alternative: Anthropic's action, anthropics/claude-code-action@v1, with a
# `prompt` input and the same flags in `claude_args`, for example
#   claude_args: '--permission-mode dontAsk --allowedTools "Read,Bash(uv run pytest *)" --max-turns 15'
