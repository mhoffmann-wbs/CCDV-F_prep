[project]
name = "gridiron-labs"
version = "0.1.0"
description = "Hands-on labs for Gridiron Prep (CCDV-F). Run each lab with your own ANTHROPIC_API_KEY."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "claude-agent-sdk>=0.2.168",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridiron"]

[tool.pytest.ini_options]
# Each lab folder holds its own tests next to its helper modules.
testpaths = ["gridiron", "."]
python_files = ["test_*.py"]
addopts = "-q"
